# A reader's report (an issue labelled "report", opened by tools/report-worker/)
# becomes a pull request that flags the question. The script does the work;
# the body arrives through the environment so nothing in it is ever run.
name: Report to PR

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  pr:
    if: contains(github.event.issue.labels.*.name, 'report')
    runs-on: ubuntu-latest
    concurrency:
      group: report-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Flag the question and open the pull request
        run: python3 tools/report_to_pr.py
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
